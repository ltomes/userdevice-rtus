[project]
name = "userdevice-rtus"
version = "0.1.0"
description = "userDevice RTUS — 2x video upscaling under a hard real-time frame budget"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "userDevice" }]
keywords = ["super-resolution", "real-time", "tensorrt", "video", "upscaling"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]

# Runtime floor: what it takes to BUILD a model, load weights, and score it.
# Deliberately excludes traiNNer (training-only, installed from git) so that
# evaluation and export work in a small environment.
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pillow>=10.0",
    "safetensors>=0.4",
    # fetch_assets.sh pulls the teacher and the face-gate detector by pinned
    # revision and verifies their digests.
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
# Training. traiNNer-redux is not on PyPI and is pinned by revision: the
# architecture registry contract and the metric implementations both come from
# it, so an unpinned upstream can silently change reported numbers.
train = [
    "traiNNer @ git+https://github.com/the-database/traiNNer-redux@master",
]
# Teacher-target generation and the teacher ablation load the teacher through
# spandrel rather than through this repo's own architecture code.
teacher = ["spandrel>=0.4"]
# ONNX export and the face gate's SCRFD detector.
export = ["onnx>=1.17", "onnxscript>=0.1", "onnxruntime>=1.20"]
# Everything, for the container image.
all = [
    "userdevice-rtus[train,teacher,export]",
]

[project.scripts]
rtus-train = "userdevice_rtus.cli:train"
rtus-info = "userdevice_rtus.cli:info"

[tool.hatch.metadata]
# The train extra references traiNNer by git URL (it is not on PyPI).
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/userdevice_rtus"]

# Configs ship INSIDE the package, and therefore inside the image. This is
# deliberate: the alternative -- copying a config onto a node by hand -- is how
# one training config in this project's history became unrecoverable and had to
# be reconstructed from logs.
[tool.hatch.build.targets.wheel.force-include]
"configs" = "userdevice_rtus/configs"


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Vendored from upstream: rtmosr_vendored.py from RTMoSR (MIT),
# realplksr_vendored.py from neosr (Apache-2.0), rtmosr_ea_vendored.py built
# on the first. These are kept CLOSE TO UPSTREAM on purpose -- so they can be
# diffed against the original, and so the third-party attribution in NOTICE
# describes code a reader can recognise. Reformatting them to our line length
# would cost both and buy nothing.
"src/userdevice_rtus/*_vendored.py" = ["E501", "E741", "E401", "F401", "I001", "E402"]

# tools/ are scripts, not library modules. Several manipulate sys.path before
# importing, which is E402 by construction rather than by mistake.
#
# The rest is deliberate restraint, not indifference. These files have
# counterparts still running on odinson, and repo-vs-node divergence is an
# ACTIVE tracked defect. Every cosmetic edit here widens that diff for no
# functional gain, so the compact script style (E701/E702), an unused loop
# variable (B007) and the long lines stay as they are.
#
# B905 (zip without strict=) is held back for a different reason: adding
# strict=True changes RUNTIME BEHAVIOUR, turning a silent length mismatch
# into an exception. That is probably the right change for evaluation code --
# a truncated zip would quietly score fewer frames than reported -- but it
# must be made one call site at a time with the pipeline run afterwards, not
# swept in by a linter on release day.
"src/userdevice_rtus/tools/*" = [
    "E402", "E501", "F401", "E741", "E701", "E702", "B007", "B905",
]

# The CLI imports inside functions deliberately: rtus-info must REPORT a
# missing optional dependency rather than fail to start because of one.
"src/userdevice_rtus/cli.py" = ["E402"]
