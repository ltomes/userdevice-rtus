# Stage B1 — distillation phase: train against teacher targets
# (4xNomosWebPhoto_RealPLKSR outputs, downscaled 2x). Loss stack per
# 2026-08-16 research (log.md): fidelity-plus, NO GAN. B2 then resumes on
# real GT to restore grain the (denoising) teacher stripped — staged ECO.
# PREREQ: gen_teacher_targets.py complete; set pretrain to stage-A's final
# EMA checkpoint before launching.
name: 2x_RTMoSR_L_greyduck_stageB2
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: greyduck2x-gt-train
    type: pairedimagedataset
    dataroot_gt: [/workspace/datasets/greyduck2x/train/hr]
    dataroot_lq: [/workspace/datasets/greyduck2x/train/lr]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: greyduck2x-val
    type: pairedimagedataset
    dataroot_gt: [/workspace/datasets/greyduck2x/val/hr]
    dataroot_lq: [/workspace/datasets/greyduck2x/val/lr]

network_g:
  type: rtmosr_l

path:
  # UPDATE before launch: stage-A final EMA checkpoint
  pretrain_network_g: /workspace/experiments/2x_RTMoSR_L_greyduck_stageB1/models/net_g_ema_50000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2.5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [20000]
    gamma: 0.5
  total_iter: 30000
  warmup_iter: 500
  losses:
    - type: msssiml1loss
      loss_weight: 1.0
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: distsloss
      loss_weight: 0.25
    - type: hsluvloss
      criterion: charbonnier
      loss_weight: 0.5
    - type: ldlloss
      criterion: l1
      loss_weight: 0.5
    - type: ffloss
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true
