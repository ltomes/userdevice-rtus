# userDevice film-tier d48-b3, stage D2: TEXTURE PUSH VIA LOSSES
# Races D1 (texture push via targets). Same blend45 targets as stage-C, so
# the loss change is the only variable between C and D2.
#  - distsloss 0.3 -> 0.45 (perceptual pressure, the metric we ship against)
#  - ganloss 0.02 -> 0.05 (texture synthesis; the hallucination risk lives
#    here, which is exactly why the probe and face gate are the fence)
#  - LDL stays 0.5 as artifact police; raising GAN without it invites the
#    speckle that failed earlier attempts.
# Ship bar: DISTS/LPIPS comfortably negative vs teacher; face gate blocking.
name: 2x_RTMoSREA_film_stageD2
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: rtus-blend45-train
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/rtus2x_v2_blend45/train/hr,
      /workspace/datasets/rtus2x_blend45/train/hr
    ]
    dataroot_lq: [
      /workspace/datasets/rtus2x_v2/train/lr,
      /workspace/datasets/rtus2x/train/lr
    ]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 16
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: rtus-val-realGT
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/rtus2x_v2/val/hr,
      /workspace/datasets/rtus2x/val/hr
    ]
    dataroot_lq: [
      /workspace/datasets/rtus2x_v2/val/lr,
      /workspace/datasets/rtus2x/val/lr
    ]

network_g:
  type: rtmosr_ea_film

network_d:
  type: dunet

path:
  pretrain_network_g: /workspace/experiments/2x_RTMoSREA_film_stageA/models/net_g_ema_150000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~   # was: 2x_RTMoSREA_film_stageD2/training_states/10000.state -- seed it before launch if resuming

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2.5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [35000]
    gamma: 0.5
  total_iter: 50000
  warmup_iter: 500
  losses:
    - type: msssiml1loss
      loss_weight: 1.0
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: distsloss
      loss_weight: 0.45
    - type: hsluvloss
      criterion: charbonnier
      loss_weight: 0.5
    - type: ldlloss
      criterion: l1
      loss_weight: 0.5
    - type: ffloss
      loss_weight: 0.05
    - type: ganloss
      gan_type: vanilla
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
    dists:
      type: calculate_dists
    lpips:
      type: calculate_lpips
      net: alex

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true
