# d48 tier, stage E: the dists90 recipe at d48 capacity.
#
# WHY THIS CONFIG EXISTS
#   - The shipped 1080p tier is d48, running the earlier E7 recipe
#     (distsloss 0.75, everything else at the stage-D2 baseline).
#   - Every newer recipe -- the gan+ldl mechanism, and the dists90 lever
#     pushed past 0.75 -- had only ever been trained at d64 capacity. But d64
#     measures ~78.5 ms at 1080p against a 38 ms budget, making it a <=720p
#     tier, not a 1080p one. So none of those gains had ever reached the
#     tier that actually ships at 1080p.
#   - This config asks whether the dists90 recipe (distsloss 0.90,
#     ganloss 0.05, ldlloss 0.7) buys the same kind of gain at d48 that the
#     E7 recipe bought over the D2 baseline, at the SAME iteration budget.
#
# WHAT MOTIVATED IT: dists90 at d64 measured dists 0.12939, lpips 0.14467,
# invention 6.69% (below the teacher's 8.50% kill bar, and the lowest of the
# three arms tried), face gate PASS 0/60. Its best checkpoint was its last,
# so it had not converged. That measured result -- not a plan -- is why the
# recipe was worth porting down to d48. The d48 outcome is what this arm
# tests, and it was unknown when this config was written.
#
# ONLY THE RECIPE CHANGES. Every other field is copied from the stage-D2
# config, which is the base the E7 arm was probed from:
#   - distsloss 0.45 -> 0.90   (E7 used 0.75)
#   - ganloss   stays 0.05     (D2's own value)
#   - ldlloss   0.5  -> 0.7    (the artifact-police raise; ldl is what makes
#                               the gan term safe)
# Same datasets, architecture, optimiser, scheduler, pretrain checkpoint and
# validation cadence.
#
# BUDGET: total_iter 65000 is the E7 endpoint, and D2's own total_iter is
# 50000 -- so this is D2@50000 plus a 15,000-iter probe, the same probe budget
# the earlier arms used. That equal budget is the whole point: it makes the
# comparison a recipe test rather than a duration test.
#
# GOTCHA: resume_state points at this experiment's own seeded 50000.state and
# must be seeded before launch. traiNNer's check_resume() resolves weights by
# config NAME, not by the resume_state path -- it builds them from
# experiments/<name>/models -- so a resume_state pointing somewhere else is
# silently ignored.
#
# Every ckpt from this run MUST pass facegate/face_gate.py (exit 0) before
# promotion -- zero tolerance for generated faces (same rule as stage C/D2).
# Val runs against REAL GT so metrics measure fidelity, not blend fit.
name: 2x_RTMoSREA_film_stageE_dists90
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: greyduck-blend45-train
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/greyduck2x_v2_blend45/train/hr,
      /workspace/datasets/greyduck2x_blend45/train/hr
    ]
    dataroot_lq: [
      /workspace/datasets/greyduck2x_v2/train/lr,
      /workspace/datasets/greyduck2x/train/lr
    ]
    lq_size: 64
    use_hflip: true
    use_rot: true
    # Dataloader workers cost ~1.2 GB RSS each, measured. The inherited value
    # of 16 is therefore ~19 GB of workers alone, which will OOM a training
    # host that is doing anything else. Reduced to 4, matching the d64 tier's
    # stage-A config. Check free memory before raising this.
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: greyduck-val-realGT
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/greyduck2x_v2/val/hr,
      /workspace/datasets/greyduck2x/val/hr
    ]
    dataroot_lq: [
      /workspace/datasets/greyduck2x_v2/val/lr,
      /workspace/datasets/greyduck2x/val/lr
    ]

network_g:
  type: rtmosr_ea_film

network_d:
  type: dunet

path:
  pretrain_network_g: /workspace/traiNNer-redux/experiments/2x_RTMoSREA_film_stageA/models/net_g_ema_150000.safetensors
  param_key_g: ~
  strict_load_g: true
  # Seeded from D2@50000 -- see the launch doc's seeding step. Points at
  # THIS experiment's own copy of the state (check_resume trap, see header).
  resume_state: /workspace/traiNNer-redux/experiments/2x_RTMoSREA_film_stageE_dists90/training_states/50000.state

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2.5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [35000]
    gamma: 0.5
  total_iter: 65000
  warmup_iter: 500
  losses:
    - type: msssiml1loss
      loss_weight: 1.0
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: distsloss
      loss_weight: 0.90
    - type: hsluvloss
      criterion: charbonnier
      loss_weight: 0.5
    - type: ldlloss
      criterion: l1
      loss_weight: 0.7
    - type: ffloss
      loss_weight: 0.05
    - type: ganloss
      gan_type: vanilla
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
    dists:
      type: calculate_dists
    lpips:
      type: calculate_lpips
      net: alex

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true
