# userDevice film-tier d48-b3, probe stageE_dists90: WAVE-4 dists90 RECIPE
# AT d48 CAPACITY (equal-budget rerun of wave-1 E7, x86/ms arm).
#
# WHY THIS CONFIG EXISTS (autoresearch/log.md, promotion note + wave-1/wave-3):
#   - the SHIPPED 1080p tier is still d48, still running wave-1's E7 recipe
#     (distsloss 0.75, everything else at the D2 baseline) -- log.md:
#     "wave-1 best E7 (d48, 65k) | -10.35% | -6.64% | ... | PASS"
#   - every newer recipe (the gan+ldl mechanism from E4, the dists90 lever
#     tested past 0.75) was only ever trained at d64 capacity. d64 was
#     measured a <=720p tier at 78.5 ms @1080p (2026-08-20 size probe;
#     38 ms film budget) -- NOT a 1080p tier.
#   - this config asks: does the dists90 recipe (distsloss 0.90, ganloss 0.05,
#     ldlloss 0.7 -- autoresearch/NEXT-WORK.md "Verified weights" table,
#     `sd_stageC_dists90   distsloss 0.90  ldlloss 0.7  ganloss 0.05`) buy the
#     same kind of gain at d48 that E7 (dists 0.75) bought over the D2
#     baseline, when trained for the SAME iteration budget?
#
# NOTE: WAVE 4 DID RUN. Both NEXT-WORK.md ("Nothing here has been launched")
# and log.md (ends at the wave-3 d64 e7-120k entry) are STALE on this point --
# do not take either as current. Measured on the cluster 2026-08-29 via
# k8s-ops.sh get jobs -n ml: train-stagec-hybrid-r1 and train-stagec-dists90-r1
# both Complete (4h47m each); analyze-stagec-hybrid-r1 and
# analyze-stagec-dists90-r1 both Complete. Verdicts are in beads
# talos-cluster-qpt (hybrid) and talos-cluster-8pll (dists90).
#
# dists90 at d64 measured: dists 0.12939, lpips 0.14467, temporal 5.8386,
# invention 6.69% (below the teacher's 8.50% kill bar, and the lowest of the
# three arms), face gate PASS 0/60. Its best checkpoint was its LAST, so it
# had not converged. That result -- not a plan -- is why this recipe is worth
# porting to d48. The d48 OUTCOME is what this arm tests and is unknown.
#
# ONLY the recipe changes vs the wave-1 E7 arm. Every other field in this
# file is copied byte-for-byte from
# autoresearch/training/config/2x_RTMoSREA_film_stageD2.yml, which is the
# exact base E7 was probed from (log.md: "wave-1 probe therefore SEEDS its
# own experiment dir from D2@50000 (`seed_resume.sh`) and uses `auto_resume`").
#   - distsloss 0.45 -> 0.90   (dists90 recipe; E7 used 0.75)
#   - ganloss   stays 0.05     (D2's own value; dists90 recipe keeps it at 0.05)
#   - ldlloss   0.5  -> 0.7    (dists90 recipe's artifact-police raise, proven
#                                mechanism from E3->E4: log.md "ldl makes gan
#                                safe")
# Nothing else is touched: same datasets, same architecture, same optimizer/
# scheduler, same pretrain checkpoint, same val cadence.
#
# BUDGET: total_iter 65000 = the exact wave-1 E7 endpoint (log.md's E7 rows
# are all reported at "iter065000"; D2's own total_iter is 50000, so this is
# D2@50000 + 15000 new iters -- the same 15,000-iter probe budget every
# wave-1 probe used, per log.md "Wave-1 budget from measurement... 15,000
# iters @ 4.0 it/s"). resume_state below points at THIS experiment's own
# seeded 50000.state -- it must be seeded before launch (see
# 2x_RTMoSREA_film_stageE_dists90-LAUNCH.md, step 1) because traiNNer's
# check_resume() resolves weights by config NAME, not by resume_state path
# (log.md: "check_resume ... builds weight paths from
# experiments/<opt.name>/models").
#
# Every ckpt from this run MUST pass facegate/face_gate.py (exit 0) before
# promotion -- zero tolerance for generated faces (same rule as stage C/D2).
# Val runs against REAL GT so metrics measure fidelity, not blend fit.
name: 2x_RTMoSREA_film_stageE_dists90
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: greyduck-blend45-train
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/greyduck2x_v2_blend45/train/hr,
      /workspace/datasets/greyduck2x_blend45/train/hr
    ]
    dataroot_lq: [
      /workspace/datasets/greyduck2x_v2/train/lr,
      /workspace/datasets/greyduck2x/train/lr
    ]
    lq_size: 64
    use_hflip: true
    use_rot: true
    # MEASURED on ms 2026-08-30: `free -g` reports 62 total / 43 used /
    # 18 AVAILABLE, with ZFS ARC holding 8.3 GB. D2's inherited value of 16
    # workers at Thor's measured ~1.2 GB/worker is ~19 GB -- more than ms has
    # available, on the household server. Reduced to 4, which is what the
    # d64 tier's own 2x_RTMoSREA_film_sd_stageA.yml uses. Do NOT raise this
    # without re-reading `free -g` first; ms is not Thor and cannot be
    # allowed to OOM.
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: greyduck-val-realGT
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/greyduck2x_v2/val/hr,
      /workspace/datasets/greyduck2x/val/hr
    ]
    dataroot_lq: [
      /workspace/datasets/greyduck2x_v2/val/lr,
      /workspace/datasets/greyduck2x/val/lr
    ]

network_g:
  type: rtmosr_ea_film

network_d:
  type: dunet

path:
  pretrain_network_g: /workspace/traiNNer-redux/experiments/2x_RTMoSREA_film_stageA/models/net_g_ema_150000.safetensors
  param_key_g: ~
  strict_load_g: true
  # Seeded from D2@50000 -- see the launch doc's seeding step. Points at
  # THIS experiment's own copy of the state (check_resume trap, see header).
  resume_state: /workspace/traiNNer-redux/experiments/2x_RTMoSREA_film_stageE_dists90/training_states/50000.state

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2.5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [35000]
    gamma: 0.5
  total_iter: 65000
  warmup_iter: 500
  losses:
    - type: msssiml1loss
      loss_weight: 1.0
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: distsloss
      loss_weight: 0.90
    - type: hsluvloss
      criterion: charbonnier
      loss_weight: 0.5
    - type: ldlloss
      criterion: l1
      loss_weight: 0.7
    - type: ffloss
      loss_weight: 0.05
    - type: ganloss
      gan_type: vanilla
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
    dists:
      type: calculate_dists
    lpips:
      type: calculate_lpips
      net: alex

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true
