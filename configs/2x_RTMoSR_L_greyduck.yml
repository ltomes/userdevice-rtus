# Greyduck 2x live-action student — RTMoSR-L fine-tune, stage A (fidelity).
# Paired data: H.264-degraded LRs from gen_pairs_h264.sh (real codec
# artifacts, the app's actual degradation domain).
# SMOKE_ITERS note: for the smoke run, override total_iter to 2000 via the
# smoke config copy; this file is the real stage-A run (150k).
name: 2x_RTMoSR_L_greyduck_stageA
scale: 2
use_amp: true
amp_bf16: true          # A5000 is Ampere: bf16 AMP is the stable choice
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: greyduck2x-train
    type: pairedimagedataset
    dataroot_gt: [/workspace/datasets/greyduck2x/train/hr]
    dataroot_lq: [/workspace/datasets/greyduck2x/train/lr]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4     # RAM-capped host: keep the loader small
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: greyduck2x-val
    type: pairedimagedataset
    dataroot_gt: [/workspace/datasets/greyduck2x/val/hr]
    dataroot_lq: [/workspace/datasets/greyduck2x/val/lr]

network_g:
  type: rtmosr_l

path:
  pretrain_network_g: /workspace/pretrained/2x_RTMoSR_L.pth
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 1e-4          # fine-tune: half the from-scratch LR
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [75000, 120000, 140000]
    gamma: 0.5
  total_iter: 150000
  warmup_iter: 500
  losses:
    - type: charbonnierloss
      loss_weight: 1.0

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true
