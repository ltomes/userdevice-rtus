# d64 tier, stage C, dists90 recipe -- extended run.
#
# Identical to the arm it continues except total_iter 50000 -> 115000. Every
# other field, including warmup_iter, both optimiser learning rates and all
# seven loss weights (msssiml1 1.0 / perceptual 0.01 / dists 0.90 / hsluv 0.5
# / ldl 0.7 / ff 0.05 / gan 0.05), is unchanged. That is what makes the result
# a true continuation, and comparable rather than merely similar.
#
# The `name:` is deliberately UNCHANGED so --auto_resume resolves the existing
# experiment directory and continues from net_g_50000 rather than restarting:
# traiNNer resolves resume by config name, not by path.
#
# Do NOT change milestones: [35000] is already passed, and altering the LR
# schedule mid-run would break comparability with the arm this extends.
name: 2x_RTMoSREA_film_sd_stageC_dists90
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: rtus-blend45-train
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/rtus2x_v2_blend45/train/hr,
      /workspace/datasets/rtus2x_blend45/train/hr
    ]
    dataroot_lq: [
      /workspace/datasets/rtus2x_v2/train/lr,
      /workspace/datasets/rtus2x/train/lr
    ]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 6    # workers are ~1.2 GB RSS each
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: rtus-val-realGT
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/rtus2x_v2/val/hr,
      /workspace/datasets/rtus2x/val/hr
    ]
    dataroot_lq: [
      /workspace/datasets/rtus2x_v2/val/lr,
      /workspace/datasets/rtus2x/val/lr
    ]

network_g:
  type: rtmosr_ea_film_sd   # d64-b6 tier

network_d:
  type: dunet

path:
  pretrain_network_g: /workspace/experiments/2x_RTMoSREA_film_sd_stageA/models/net_g_ema_150000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2.5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  optim_d:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [35000]
    gamma: 0.5
  total_iter: 115000        # WAVE 5: extended from 50000 to match e7@115k budget
  warmup_iter: 500
  losses:
    - type: msssiml1loss
      loss_weight: 1.0
    - type: perceptualloss
      criterion: charbonnier
      loss_weight: 0.01
    - type: distsloss
      loss_weight: 0.90
    - type: hsluvloss
      criterion: charbonnier
      loss_weight: 0.5
    - type: ldlloss
      criterion: l1
      loss_weight: 0.7
    - type: ffloss
      loss_weight: 0.05
    - type: ganloss
      gan_type: vanilla
      loss_weight: 0.05

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true
    dists:
      type: calculate_dists
    lpips:
      type: calculate_lpips
      net: alex

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true
