# Stage B-fid (CONSERVATIVE variant, 2026-08-20) — Shield-class fidelity.
# Motivated by remote QA: user has zero tolerance for face-like texture
# artifacts; perceptual losses (dists/ldl/ff) accentuate compression
# residue. This variant continues stage-A's pure-charbonnier recipe on the
# FULL v1+v2 data against REAL GT (no blend targets, no teacher, no
# perceptual losses) — it cannot learn to add texture energy, only to
# restore. A/B against stage-B at projector QA.
name: 2x_RTMoSR_L_greyduck_stageB_fid
scale: 2
use_amp: true
amp_bf16: true
use_channels_last: false
fast_matmul: false
use_compile: false
num_gpu: auto
manual_seed: 1024

datasets:
  train:
    name: greyduck2x-realGT-train
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/greyduck2x_v2/train/hr,
      /workspace/datasets/greyduck2x/train/hr
    ]
    dataroot_lq: [
      /workspace/datasets/greyduck2x_v2/train/lr,
      /workspace/datasets/greyduck2x/train/lr
    ]
    lq_size: 64
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    accum_iter: 1
  val:
    name: greyduck2x-val-realGT
    type: pairedimagedataset
    dataroot_gt: [
      /workspace/datasets/greyduck2x_v2/val/hr,
      /workspace/datasets/greyduck2x/val/hr
    ]
    dataroot_lq: [
      /workspace/datasets/greyduck2x_v2/val/lr,
      /workspace/datasets/greyduck2x/val/lr
    ]

network_g:
  type: rtmosr_l

path:
  pretrain_network_g: /workspace/traiNNer-redux/experiments/2x_RTMoSR_L_greyduck_stageA/models/net_g_ema_150000.safetensors
  param_key_g: ~
  strict_load_g: true
  resume_state: ~

train:
  ema_decay: 0.999
  ema_power: 0.75
  grad_clip: true
  grad_clip_max_norm: 100
  optim_g:
    type: AdamW
    lr: !!float 2.5e-5
    weight_decay: 0
    betas: [0.9, 0.99]
  scheduler:
    type: MultiStepLR
    milestones: [35000]
    gamma: 0.5
  total_iter: 50000
  warmup_iter: 500
  losses:
    - type: charbonnierloss
      loss_weight: 1.0

val:
  val_enabled: true
  val_freq: 5000
  save_img: false
  tile_size: 0
  tile_overlap: 8
  metrics_enabled: true
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: true

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  save_checkpoint_format: safetensors
  use_tb_logger: true
